name: Deploy to staging
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.18.0]
    name: Deploy to staging with Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: the sitemap takes <lastmod> from git log
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci --quiet
      - name: Inject API key
        run: |
          sed -i 's/<NEXT_PUBLIC_API_KEY>/${{ secrets.API_KEY }}/g' src/utils/apiAuth.js
      - name: Create .env.local file
        run: |
          cp .env.example .env.local
          sed -i 's/<SMTP_USER>/${{ secrets.SMTP_USER }}/g' .env.local
          sed -i 's/<SMTP_PASS>/${{ secrets.SMTP_PASS }}/g' .env.local
          sed -i 's/<BASIC_AUTH_USER>/${{ secrets.BASIC_AUTH_USER }}/g' .env.local
          sed -i 's/<BASIC_AUTH_PASS>/${{ secrets.BASIC_AUTH_PASS }}/g' .env.local
          sed -i 's/<API_KEY>/${{ secrets.API_KEY }}/g' .env.local
          sed -i 's/<NEXT_PUBLIC_API_KEY>/${{ secrets.API_KEY }}/g' .env.local
          sed -i 's|<NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN>|${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}|g' .env.local
          sed -i 's|<NEXT_PUBLIC_POSTHOG_HOST>|${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}|g' .env.local
          sed -i 's|<META_CAPI_ACCESS_TOKEN>|${{ secrets.META_CAPI_ACCESS_TOKEN }}|g' .env.local
          # Staging only, and appended rather than substituted because this key
          # is deliberately absent from .env.example: on production it would put
          # every conversion in "Test events", where Meta excludes it from
          # optimisation. Unset secret means an empty value, which is falsy.
          echo 'META_CAPI_TEST_EVENT_CODE="${{ secrets.META_CAPI_TEST_EVENT_CODE }}"' >> .env.local
          sed -i 's/<CSV_FILE_PATH>/\/home\/rozmowni\/rails\/stage-test-results.csv/g' .env.local
      - name: Build project
        run: npm run build
      - name: Remove dev dependencies
        run: npm prune --omit=dev
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: just-a-placeholder-so-we-dont-get-errors
      - name: Adding known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Set release date as env variable
        run: echo "RELEASE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
      - name: Set application directory as env variable
        run: echo "APP_DIR=/home/rozmowni/rails" >> $GITHUB_ENV
      - name: Set application releases directory as env variable
        run: echo "RELEASES_DIR=/home/rozmowni/rails/rozmowni_staging_releases" >> $GITHUB_ENV
      - name: Set symlink name as env variable
        run: echo "SYMLINK_NAME=rozmowni_staging" >> $GITHUB_ENV
      - name: Record revision
        run: |
          echo "${GITHUB_SHA}" > REVISION
          echo "Deploying \`${GITHUB_SHA:0:7}\` as release \`${RELEASE}\`" >> $GITHUB_STEP_SUMMARY
      - name: Create app archive
        run: tar --exclude=".git" --exclude=".github" --exclude=".next/cache" -zcf app_${{ env.RELEASE }}.tar.gz * .??*
      - name: Upload app archive to server
        run: rsync -av ./app_${{ env.RELEASE }}.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/rozmowni
      - name: Switch app on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Staging keeps exactly one release: the current one is dropped
            # before the new one is unpacked. That means no rollback on staging
            # (production still keeps the previous release for that) and a short
            # window with no release directory at all.
            rm -f ${{ env.APP_DIR }}/${{ env.SYMLINK_NAME }}
            rm -rf ${{ env.RELEASES_DIR }}
            mkdir -p ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}
            mv ~/app_${{ env.RELEASE }}.tar.gz ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}
            tar -xf ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}/app_${{ env.RELEASE }}.tar.gz -C ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}
            rm ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}/app_${{ env.RELEASE }}.tar.gz
            ln -s ${{ env.RELEASES_DIR }}/${{ env.RELEASE }} ${{ env.APP_DIR }}/${{ env.SYMLINK_NAME }}
            ln -s ${{ env.APP_DIR }}/shared ${{ env.APP_DIR }}/${{ env.SYMLINK_NAME }}/public
            mkdir -p ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}/tmp
            touch ${{ env.RELEASES_DIR }}/${{ env.RELEASE }}/tmp/restart.txt
